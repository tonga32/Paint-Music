<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paint Musical - TR-909 PRO Polyphonic</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #121218;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
        }
        h1 { margin: 5px 0; font-size: 1.3rem; text-align: center; }
        p { margin: 0 0 8px 0; color: #a0a0c0; font-size: 0.8rem; text-align: center; }
        
        #controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            background: #1e1e2f;
            padding: 8px;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        button, select, input {
            padding: 5px 7px;
            border: none;
            border-radius: 5px;
            background: #4e4efc;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
        }
        button:hover, select:hover { background: #3b3bfc; }
        button.active { background: #ff7675; }
        
        input[type="color"] {
            border: none;
            width: 30px;
            height: 26px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        input[type="range"] {
            width: 65px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #3a3a5c;
            background: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #gridCanvas {
            pointer-events: none;
            display: none; /* Oculto por defecto */
        }

        #scanLine {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: #ff4757;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 8px #ff4757;
        }
    </style>
</head>
<body>

    <h1>Paint Musical & TR-909 PRO</h1>
    <p>¡Tempo perfecto, polifonía por herramienta y glissandos!</p>

    <div id="controls">
        <div class="control-group">
            <button class="tool-btn active" data-tool="lapiz" title="Lápiz">✏️</button>
            <button class="tool-btn" data-tool="crayon" title="Crayón">🖍️</button>
            <button class="tool-btn" data-tool="fibra" title="Fibra">✒️</button>
            <button class="tool-btn" data-tool="pincel" title="Pincel">🖌️</button>
            <button class="tool-btn" data-tool="aerosol" title="Spray">💨</button>
        </div>

        <div class="control-group">
            <button class="tool-btn" data-tool="kick" title="Kick">⭕</button>
            <button class="tool-btn" data-tool="hihat" title="Hi-Hat">🔺</button>
            <button class="tool-btn" data-tool="snare" title="Snare">⬜</button>
            <button class="tool-btn" data-tool="clap" title="Clap">👏</button>
            <button class="tool-btn" data-tool="goma" title="Borrar">❌</button>
        </div>

        <div class="control-group">
            <input type="color" id="colorPicker" value="#000000" title="Color">
        </div>

        <div class="control-group">
            <label>Grosor:</label>
            <input type="range" id="sizeRange" min="1" max="25" value="4">
        </div>

        <div class="control-group">
            <label>Escala:</label>
            <select id="scaleSelect">
                <option value="pentatonic_menor" selected>Penta Menor</option>
                <option value="pentatonic_mayor">Penta Mayor</option>
            </select>
        </div>

        <div class="control-group">
            <label>Tempo:</label>
            <select id="tempoSelect">
                <option value="180">Lento</option>
                <option value="250" selected>Normal</option>
                <option value="340">Rápido</option>
            </select>
        </div>

        <div class="control-group">
            <button id="gridBtn">Grilla: OFF</button>
            <button id="playBtn" style="background: #00b894;">▶ Play</button>
            <button id="undoBtn" style="background: #e17055;">↶</button>
            <button id="clearBtn" style="background: #d63031;">🗑</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="500" height="500"></canvas>
        <canvas id="gridCanvas" width="500" height="500"></canvas>
        <canvas id="audioCanvas" width="500" height="500" style="display:none;"></canvas>
        <div id="scanLine"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audioCanvas = document.getElementById('audioCanvas');
        const audioCtx2D = audioCanvas.getContext('2d');
        const gridCanvas = document.getElementById('gridCanvas');
        const gridCtx = gridCanvas.getContext('2d');
        const scanLine = document.getElementById('scanLine');

        const STEPS = 16; 
        const ROWS = 11;

        let isDrawing = false;
        let currentTool = 'lapiz';
        let isPlaying = false;
        let playheadX = 0;
        let lastAudioTime = 0;
        let lastStep = -1;
        let lastColIndex = -1;
        
        // ¡ESTA ERA LA VARIABLE QUE FALTABA!
        let showGrid = false; 
        
        let activeSynths = { lapiz: [], crayon: [], fibra: [], pincel: [] };
        
        let audioCtx = null;
        let masterGain = null;
        let masterCompressor = null;
        
        let drumSequence = Array(STEPS).fill(null).map(() => ([]));
        let history = [];

        gridCtx.strokeStyle = 'rgba(200, 200, 220, 0.7)';
        gridCtx.lineWidth = 1;
        gridCtx.setLineDash([4, 4]);
        for (let i = 1; i < STEPS; i++) {
            const x = (gridCanvas.width / STEPS) * i;
            gridCtx.beginPath(); gridCtx.moveTo(x, 0); gridCtx.lineTo(x, gridCanvas.height); gridCtx.stroke();
        }
        for (let i = 1; i < ROWS; i++) {
            const y = (gridCanvas.height / ROWS) * i;
            gridCtx.beginPath(); gridCtx.moveTo(0, y); gridCtx.lineTo(gridCanvas.width, y); gridCtx.stroke();
        }

        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            masterCompressor = audioCtx.createDynamicsCompressor();
            masterCompressor.threshold.value = -3;
            masterCompressor.knee.value = 10;
            masterCompressor.ratio.value = 4;
            masterCompressor.attack.value = 0.01;
            masterCompressor.release.value = 0.1;

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.9; 

            masterGain.connect(masterCompressor);
            masterCompressor.connect(audioCtx.destination);
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        window.addEventListener('mousedown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        function saveState() {
            history.push({
                main: ctx.getImageData(0, 0, canvas.width, canvas.height),
                audio: audioCtx2D.getImageData(0, 0, audioCanvas.width, audioCanvas.height),
                drums: JSON.parse(JSON.stringify(drumSequence))
            });
            if (history.length > 25) history.shift();
        }

        const toolAudioMap = {
            lapiz:   { type: 'sine',     audioRed: 10 },
            crayon:  { type: 'triangle', audioRed: 20 },
            fibra:   { type: 'sawtooth', audioRed: 30 },
            pincel:  { type: 'sine',     audioRed: 40 },
            aerosol: { type: 'square',   audioRed: 50 }
        };

        const scales = {
            pentatonic_mayor: [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25],
            pentatonic_menor: [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23, 392.00, 466.16, 523.25]
        };

        function quantizePos(x, y) {
            const cellW = canvas.width / STEPS;
            const cellH = canvas.height / ROWS;
            const col = Math.min(STEPS - 1, Math.max(0, Math.floor(x / cellW)));
            const row = Math.min(ROWS - 1, Math.max(0, Math.floor(y / cellH)));
            return { col, row, x: (col * cellW) + (cellW / 2), y: (row * cellH) + (cellH / 2), rectX: col * cellW, rectY: row * cellH, cellW, cellH };
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        saveState();

        // Lógica del botón de grilla corregida
        document.getElementById('gridBtn').addEventListener('click', (e) => {
            showGrid = !showGrid;
            e.target.classList.toggle('active', showGrid);
            e.target.textContent = showGrid ? 'Grilla: ON' : 'Grilla: OFF';
            gridCanvas.style.display = showGrid ? 'block' : 'none';
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const targetBtn = e.target.closest('button');
                targetBtn.classList.add('active');
                currentTool = targetBtn.dataset.tool;
            });
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        let lastX = 0, lastY = 0;

        function startDown(e) {
            e.preventDefault();
            initAudio(); 
            const pos = getPos(e);
            const isPercussion = ['kick', 'hihat', 'snare', 'clap'].includes(currentTool);
            saveState();
            isDrawing = true;
            lastX = pos.x; lastY = pos.y;
            
            if (isPercussion) {
                const q = quantizePos(pos.x, pos.y);
                if (!drumSequence[q.col].some(d => d.row === q.row && d.tool === currentTool)) {
                    drumSequence[q.col].push({ tool: currentTool, row: q.row });
                    drawShape(q.x, q.y, currentTool);
                    playPercussion(currentTool, 1.0);
                }
            } else if (currentTool === 'goma') {
                draw(e);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            if (['kick', 'hihat', 'snare', 'clap'].includes(currentTool)) return;

            const color = document.getElementById('colorPicker').value;
            const size = parseInt(document.getElementById('sizeRange').value);

            if (currentTool === 'goma') {
                ctx.save(); ctx.beginPath(); ctx.arc(pos.x, pos.y, size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore();

                audioCtx2D.save(); audioCtx2D.beginPath(); audioCtx2D.arc(pos.x, pos.y, size * 1.5, 0, Math.PI * 2);
                audioCtx2D.globalCompositeOperation = 'destination-out';
                audioCtx2D.fillStyle = 'rgba(0,0,0,1)'; audioCtx2D.fill();
                audioCtx2D.globalCompositeOperation = 'source-over'; audioCtx2D.restore();
                
                const q = quantizePos(pos.x, pos.y);
                drumSequence[q.col] = drumSequence[q.col].filter(d => d.row !== q.row);
                lastX = pos.x; lastY = pos.y; return;
            }

            const toolInfo = toolAudioMap[currentTool];
            const audioColorStr = `rgb(${toolInfo.audioRed}, ${size}, 0)`;

            ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = color; ctx.fillStyle = color;
            
            audioCtx2D.globalCompositeOperation = 'source-over'; audioCtx2D.globalAlpha = 1.0;
            audioCtx2D.lineWidth = size; audioCtx2D.lineCap = 'round'; audioCtx2D.lineJoin = 'round';
            audioCtx2D.strokeStyle = audioColorStr; audioCtx2D.fillStyle = audioColorStr;

            if (currentTool === 'aerosol') {
                for (let i = 0; i < 10; i++) {
                    const offsetX = (Math.random() - 0.5) * size * 2.5; const offsetY = (Math.random() - 0.5) * size * 2.5;
                    ctx.globalAlpha = 0.3; ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                    audioCtx2D.globalAlpha = 0.6; audioCtx2D.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                }
                ctx.globalAlpha = 1.0; audioCtx2D.globalAlpha = 1.0;
            } else {
                drawLine(ctx, lastX, lastY, pos.x, pos.y); 
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            }
            lastX = pos.x; lastY = pos.y;
        }

        function drawShape(x, y, tool) {
            const rawSize = parseInt(document.getElementById('sizeRange').value);
            const size = Math.max(rawSize * 1.5, 14); 
            ctx.save();
            if (tool === 'kick') { ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill(); }
            else if (tool === 'hihat') { ctx.fillStyle = '#2ed573'; ctx.beginPath(); ctx.moveTo(x, y - size); ctx.lineTo(x - size, y + size); ctx.lineTo(x + size, y + size); ctx.closePath(); ctx.fill(); }
            else if (tool === 'snare') { ctx.fillStyle = '#1e90ff'; ctx.fillRect(x - size, y - size, size * 2, size * 2); }
            else if (tool === 'clap') { ctx.fillStyle = '#ffa502'; ctx.beginPath(); ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath(); ctx.fill(); }
            ctx.restore();
        }

        function drawLine(context, x1, y1, x2, y2) { context.beginPath(); context.moveTo(x1, y1); context.lineTo(x2, y2); context.stroke(); }
        function stopDraw() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDown); canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('touchstart', startDown, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stopDraw);

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (history.length > 0) {
                const prevState = history.pop();
                ctx.putImageData(prevState.main, 0, 0); audioCtx2D.putImageData(prevState.audio, 0, 0);
                drumSequence = JSON.parse(JSON.stringify(prevState.drums));
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            saveState(); 
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
            drumSequence = Array(STEPS).fill(null).map(() => ([])); 
        });

        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', () => {
            initAudio(); 
            isPlaying = !isPlaying;
            playBtn.classList.toggle('active', isPlaying);
            playBtn.textContent = isPlaying ? '⏸ Pausa' : '▶ Play';
            scanLine.style.display = isPlaying ? 'block' : 'none';

            if (!isPlaying) {
                stopAllSynths();
                lastColIndex = -1;
            } else {
                lastAudioTime = audioCtx.currentTime; 
            }
        });

        function stopAllSynths() {
            Object.keys(activeSynths).forEach(tool => {
                activeSynths[tool].forEach(synth => {
                    try {
                        synth.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.03);
                        synth.osc.stop(audioCtx.currentTime + 0.1);
                    } catch(e) {}
                });
                activeSynths[tool] = [];
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying || !audioCtx) return;

            const now = audioCtx.currentTime;
            let dt = now - lastAudioTime;
            lastAudioTime = now;
            
            if (dt > 0.1) dt = 0.1; 

            const pixelsPerSecond = parseFloat(document.getElementById('tempoSelect').value);
            playheadX += dt * pixelsPerSecond;

            if (playheadX >= canvas.width) {
                playheadX = playheadX % canvas.width;
                lastStep = -1; 
                lastColIndex = -1;
            }

            scanLine.style.left = (playheadX / canvas.width * 100) + '%';

            const currentStep = Math.floor(playheadX / (canvas.width / STEPS));
            if (currentStep !== lastStep && currentStep >= 0 && currentStep < STEPS) {
                lastStep = currentStep;
                drumSequence[currentStep].forEach(drum => playPercussion(drum.tool, 1.0));
            }

            const colIndex = Math.floor(playheadX);
            if (colIndex !== lastColIndex && colIndex < audioCanvas.width) {
                lastColIndex = colIndex;
                processColumnAudio(colIndex, now);
            }
        }

        function processColumnAudio(colIndex, now) {
            const imgData = audioCtx2D.getImageData(colIndex, 0, 1, audioCanvas.height);
            const data = imgData.data;
            const scaleType = document.getElementById('scaleSelect').value || 'pentatonic_menor';
            const currentScale = scales[scaleType];

            let toolBlobs = { lapiz: [], crayon: [], fibra: [], pincel: [] };
            let currentBlob = null;
            let aerosolTriggered = false;

            for (let y = 0; y < audioCanvas.height; y += 2) {
                const alpha = data[(y * 4) + 3];
                let toolFound = null;

                if (alpha > 20) {
                    const r = data[(y * 4)];
                    const rSnap = Math.round(r / 10) * 10;
                    if (rSnap === 10) toolFound = 'lapiz';
                    else if (rSnap === 20) toolFound = 'crayon';
                    else if (rSnap === 30) toolFound = 'fibra';
                    else if (rSnap === 40) toolFound = 'pincel';
                    else if (rSnap === 50) {
                        if (!aerosolTriggered) {
                            const noteIndex = Math.floor(((audioCanvas.height - y) / audioCanvas.height) * currentScale.length);
                            playShortTone(currentScale[Math.min(noteIndex, currentScale.length - 1)], 'square');
                            aerosolTriggered = true;
                        }
                    }
                }

                if (toolFound) {
                    if (!currentBlob || currentBlob.tool !== toolFound) {
                        if (currentBlob) toolBlobs[currentBlob.tool].push(currentBlob);
                        currentBlob = { tool: toolFound, startY: y, endY: y };
                    } else {
                        currentBlob.endY = y;
                    }
                } else {
                    if (currentBlob) {
                        toolBlobs[currentBlob.tool].push(currentBlob);
                        currentBlob = null;
                    }
                }
            }
            if (currentBlob) toolBlobs[currentBlob.tool].push(currentBlob);

            Object.keys(toolBlobs).forEach(tool => {
                let blobs = toolBlobs[tool];
                let freqs = blobs.map(b => {
                    let centerY = (b.startY + b.endY) / 2;
                    let noteIndex = Math.floor(((audioCanvas.height - centerY) / audioCanvas.height) * currentScale.length);
                    return currentScale[Math.min(noteIndex, currentScale.length - 1)];
                });

                let synths = activeSynths[tool];
                
                freqs.sort((a, b) => a - b);
                synths.sort((a, b) => a.currentFreq - b.currentFreq);

                let newSynths = [];
                let maxCount = Math.max(freqs.length, synths.length);

                for (let i = 0; i < maxCount; i++) {
                    if (i < freqs.length && i < synths.length) {
                        let synth = synths[i];
                        synth.osc.frequency.setTargetAtTime(freqs[i], now, 0.02);
                        synth.currentFreq = freqs[i];
                        synth.gain.gain.setTargetAtTime(0.18, now, 0.02);
                        newSynths.push(synth);
                    } else if (i < freqs.length) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = toolAudioMap[tool].type;
                        osc.frequency.setValueAtTime(freqs[i], now);
                        gain.gain.setValueAtTime(0.0001, now);
                        gain.gain.linearRampToValueAtTime(0.18, now + 0.03);
                        osc.connect(gain); gain.connect(masterGain);
                        osc.start();
                        newSynths.push({ osc, gain, currentFreq: freqs[i] });
                    } else {
                        let synth = synths[i];
                        synth.gain.gain.setTargetAtTime(0.0001, now, 0.03);
                        synth.osc.stop(now + 0.1);
                    }
                }
                activeSynths[tool] = newSynths;
            });
        }

        function playShortTone(freq, type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = 0.15;
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(masterGain);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playPercussion(type, intensity = 1.0) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(130, now); osc.frequency.exponentialRampToValueAtTime(45, now + 0.06); 
                gain.gain.setValueAtTime(1.8, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain); gain.connect(masterGain); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'hihat') {
                const bufferSize = audioCtx.sampleRate * 0.04;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 7000;
                const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.7, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                noise.connect(filter); filter.connect(gain); gain.connect(masterGain); noise.start(now); noise.stop(now + 0.1);
            } else if (type === 'snare') {
                const osc = audioCtx.createOscillator(); const oscGain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                oscGain.gain.setValueAtTime(0.6, now); oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08); 
                osc.connect(oscGain); oscGain.connect(masterGain); osc.start(now); osc.stop(now + 0.1);

                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 2500;
                const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.7, now); noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); 
                noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain); noise.start(now); noise.stop(now + 0.15);
            } else if (type === 'clap') {
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1500;
                const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                noise.connect(filter); filter.connect(gain); gain.connect(masterGain); noise.start(now); noise.stop(now + 0.25);
            }
        }

        animate();
    </script>
