<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paint Musical Pentatónico</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #121218;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
        }
        h1 { margin: 5px 0; font-size: 1.4rem; text-align: center; }
        p { margin: 0 0 10px 0; color: #a0a0c0; font-size: 0.85rem; text-align: center; }
        
        #controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            background: #1e1e2f;
            padding: 8px;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 500px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
        }
        button, select, input {
            padding: 6px 8px;
            border: none;
            border-radius: 5px;
            background: #4e4efc;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover, select:hover { background: #3b3bfc; }
        button.active { background: #ff7675; }
        
        input[type="color"] {
            border: none;
            width: 32px;
            height: 28px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        input[type="range"] {
            width: 70px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #3a3a5c;
            background: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #scanLine {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Paint Musical Pentatónico</h1>
    <p>Dibujá y dale Play para escanear tus trazos.</p>

    <div id="controls">
        <div class="control-group">
            <button class="tool-btn active" data-tool="lapiz" title="Lápiz">✏️</button>
            <button class="tool-btn" data-tool="crayon" title="Crayón">🖍️</button>
            <button class="tool-btn" data-tool="fibra" title="Fibra">✒️</button>
            <button class="tool-btn" data-tool="pincel" title="Pincel">🖌️</button>
            <button class="tool-btn" data-tool="aerosol" title="Spray">💨</button>
        </div>

        <div class="control-group">
            <input type="color" id="colorPicker" value="#000000" title="Color">
        </div>

        <div class="control-group">
            <label>Grosor:</label>
            <input type="range" id="sizeRange" min="1" max="25" value="4">
        </div>

        <div class="control-group">
            <label>Tempo:</label>
            <select id="tempoSelect">
                <option value="1">Lento</option>
                <option value="2" selected>Normal</option>
                <option value="3.5">Rápido</option>
            </select>
        </div>

        <div class="control-group">
            <label>Escala:</label>
            <select id="scaleSelect">
                <option value="mayor">Mayor</option>
                <option value="menor">Menor</option>
            </select>
        </div>

        <div class="control-group">
            <button id="playBtn" style="background: #00b894;">▶ Play</button>
            <button id="undoBtn" style="background: #e17055;">↶</button>
            <button id="clearBtn" style="background: #d63031;">🗑</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="500" height="500"></canvas>
        <canvas id="audioCanvas" width="500" height="500" style="display:none;"></canvas>
        <div id="scanLine"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const audioCanvas = document.getElementById('audioCanvas');
        const audioCtx2D = audioCanvas.getContext('2d');
        
        const scanLine = document.getElementById('scanLine');

        let isDrawing = false;
        let currentTool = 'lapiz';
        let isPlaying = false;
        let scanX = 0;
        let audioCtx = null;
        
        let history = [];

        function saveState() {
            history.push({
                main: ctx.getImageData(0, 0, canvas.width, canvas.height),
                audio: audioCtx2D.getImageData(0, 0, audioCanvas.width, audioCanvas.height)
            });
            if (history.length > 20) history.shift();
        }

        // Definimos códigos de canal rojo únicos para cada instrumento (valores exactos 10, 20, 30, 40, 50)
        const toolAudioMap = {
            lapiz:   { type: 'sine',     audioRed: 10 },
            crayon:  { type: 'triangle', audioRed: 20 },
            fibra:   { type: 'sawtooth', audioRed: 30 },
            pincel:  { type: 'sine',     audioRed: 40 },
            aerosol: { type: 'square',   audioRed: 50 }
        };

        const scales = {
            mayor: [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25],
            menor: [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23, 392.00, 466.16, 523.25]
        };

        // Canvas principal blanco
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Canvas de audio transparente (limpio por completo)
        audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        saveState();

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const targetBtn = e.target.closest('button');
                targetBtn.classList.add('active');
                currentTool = targetBtn.dataset.tool;
            });
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        let lastX = 0, lastY = 0;

        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;
            saveState();
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            
            const color = document.getElementById('colorPicker').value;
            const size = parseInt(document.getElementById('sizeRange').value);
            const toolInfo = toolAudioMap[currentTool];
            const audioColorStr = `rgb(${toolInfo.audioRed}, 0, 0)`;

            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = color;
            ctx.fillStyle = color;

            audioCtx2D.lineWidth = size;
            audioCtx2D.lineCap = 'round';
            audioCtx2D.lineJoin = 'round';
            audioCtx2D.strokeStyle = audioColorStr;
            audioCtx2D.fillStyle = audioColorStr;

            if (currentTool === 'aerosol') {
                for (let i = 0; i < 10; i++) {
                    const offsetX = (Math.random() - 0.5) * size * 2.5;
                    const offsetY = (Math.random() - 0.5) * size * 2.5;
                    
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                    ctx.globalAlpha = 1.0;

                    audioCtx2D.globalAlpha = 0.3;
                    audioCtx2D.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                    audioCtx2D.globalAlpha = 1.0;
                }
            } else if (currentTool === 'crayon') {
                ctx.globalAlpha = 0.5;
                audioCtx2D.globalAlpha = 0.5;
                drawLine(ctx, lastX, lastY, pos.x, pos.y);
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
                ctx.globalAlpha = 1.0;
                audioCtx2D.globalAlpha = 1.0;
            } else if (currentTool === 'pincel') {
                ctx.globalAlpha = 0.3;
                audioCtx2D.globalAlpha = 0.3;
                ctx.lineWidth = size * 1.8;
                audioCtx2D.lineWidth = size * 1.8;
                drawLine(ctx, lastX, lastY, pos.x, pos.y);
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
                ctx.globalAlpha = 1.0;
                audioCtx2D.globalAlpha = 1.0;
            } else if (currentTool === 'fibra') {
                ctx.lineWidth = size * 1.2;
                audioCtx2D.lineWidth = size * 1.2;
                drawLine(ctx, lastX, lastY, pos.x, pos.y);
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            } else {
                drawLine(ctx, lastX, lastY, pos.x, pos.y);
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            }

            lastX = pos.x;
            lastY = pos.y;
        }

        function drawLine(context, x1, y1, x2, y2) {
            context.beginPath();
            context.moveTo(x1, y1);
            context.lineTo(x2, y2);
            context.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDraw);

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (history.length > 1) {
                history.pop();
                const prevState = history[history.length - 1];
                ctx.putImageData(prevState.main, 0, 0);
                audioCtx2D.putImageData(prevState.audio, 0, 0);
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            saveState();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        });

        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isPlaying = !isPlaying;
            playBtn.classList.toggle('active', isPlaying);
            playBtn.textContent = isPlaying ? '⏸ Pausa' : '▶ Play';
            scanLine.style.display = isPlaying ? 'block' : 'none';
        });

        function animate() {
            requestAnimationFrame(animate);

            if (!isPlaying) return;

            const speed = parseFloat(document.getElementById('tempoSelect').value);
            scanX += speed;
            if (scanX > canvas.width) scanX = 0;

            const percent = (scanX / canvas.width) * 100;
            scanLine.style.left = percent + '%';

            checkColumnAndPlay(scanX);
        }

        function checkColumnAndPlay(x) {
            const colIndex = Math.floor(x);
            if (colIndex >= audioCanvas.width) return;

            const imgData = audioCtx2D.getImageData(colIndex, 0, 1, audioCanvas.height);
            const data = imgData.data;

            for (let y = 0; y < audioCanvas.height; y += 15) {
                const r = data[(y * 4)];
                const alpha = data[(y * 4) + 3];

                // Solo suena si el píxel tiene opacidad real y coincide exactamente con un código de instrumento válido
                if (alpha > 20 && (r === 10 || r === 20 || r === 30 || r === 40 || r === 50)) {
                    let detectedTool = 'lapiz';
                    if (r === 20) detectedTool = 'crayon';
                    else if (r === 30) detectedTool = 'fibra';
                    else if (r === 40) detectedTool = 'pincel';
                    else if (r === 50) detectedTool = 'aerosol';

                    const scaleType = document.getElementById('scaleSelect').value;
                    const currentScale = scales[scaleType];
                    
                    const noteIndex = Math.floor(((audioCanvas.height - y) / audioCanvas.height) * currentScale.length);
                    const frequency = currentScale[Math.min(noteIndex, currentScale.length - 1)];

                    const currentSize = parseInt(document.getElementById('sizeRange').value);
                    const intensity = Math.min(currentSize / 10, 1.5);

                    playTone(frequency, intensity, detectedTool);
                }
            }
        }

        function playTone(freq, intensity, tool) {
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = toolAudioMap[tool].type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                const baseGain = 0.02 * intensity;
                gainNode.gain.setValueAtTime(baseGain, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        animate();
    </script>
</body>
</html>
