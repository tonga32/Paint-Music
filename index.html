<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paint Musical - Drums Pro & Grid</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #121218;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
        }
        h1 { margin: 5px 0; font-size: 1.3rem; text-align: center; }
        p { margin: 0 0 8px 0; color: #a0a0c0; font-size: 0.8rem; text-align: center; }
        
        #controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            background: #1e1e2f;
            padding: 8px;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 540px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        button, select, input {
            padding: 5px 7px;
            border: none;
            border-radius: 5px;
            background: #4e4efc;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
        }
        button:hover, select:hover { background: #3b3bfc; }
        button.active { background: #ff7675; }
        
        input[type="color"] {
            border: none;
            width: 30px;
            height: 26px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        input[type="range"] {
            width: 65px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #3a3a5c;
            background: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #scanLine {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Paint Musical & TR-909 PRO</h1>
    <p>Con grilla métrica de tiempo opcional.</p>

    <div id="controls">
        <div class="control-group">
            <button class="tool-btn active" data-tool="lapiz" title="Lápiz">✏️</button>
            <button class="tool-btn" data-tool="crayon" title="Crayón">🖍️</button>
            <button class="tool-btn" data-tool="fibra" title="Fibra">✒️</button>
            <button class="tool-btn" data-tool="pincel" title="Pincel">🖌️</button>
            <button class="tool-btn" data-tool="aerosol" title="Spray">💨</button>
        </div>

        <div class="control-group">
            <button class="tool-btn" data-tool="kick" title="Kick 909 (Círculo)">⭕</button>
            <button class="tool-btn" data-tool="hihat" title="Hi-Hat 909 (Triángulo)">🔺</button>
            <button class="tool-btn" data-tool="snare" title="Snare 909 (Cuadrado)">⬜</button>
            <button class="tool-btn" data-tool="goma" title="Goma de borrar">🧹</button>
        </div>

        <div class="control-group">
            <input type="color" id="colorPicker" value="#000000" title="Color">
        </div>

        <div class="control-group">
            <label>Grosor:</label>
            <input type="range" id="sizeRange" min="1" max="25" value="4">
        </div>

        <div class="control-group">
            <label>Tempo:</label>
            <select id="tempoSelect">
                <option value="1">Lento</option>
                <option value="2" selected>Normal</option>
                <option value="3.5">Rápido</option>
            </select>
        </div>

        <div class="control-group">
            <label>Escala:</label>
            <select id="scaleSelect">
                <option value="mayor">Mayor</option>
                <option value="menor">Menor</option>
            </select>
        </div>

        <div class="control-group">
            <button id="gridBtn">Grilla: OFF</button>
            <button id="playBtn" style="background: #00b894;">▶ Play</button>
            <button id="undoBtn" style="background: #e17055;">↶</button>
            <button id="clearBtn" style="background: #d63031;">🗑</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="500" height="500"></canvas>
        <canvas id="audioCanvas" width="500" height="500" style="display:none;"></canvas>
        <div id="scanLine"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audioCanvas = document.getElementById('audioCanvas');
        const audioCtx2D = audioCanvas.getContext('2d');
        const scanLine = document.getElementById('scanLine');

        let isDrawing = false;
        let currentTool = 'lapiz';
        let isPlaying = false;
        let showGrid = false;
        let scanX = 0;
        
        let audioCtx = null;
        let masterGain = null;
        let masterCompressor = null;
        
        let continuousTones = {}; 
        let oneShotTones = {};
        
        let drumCooldown = { kick: 0, hihat: 0, snare: 0 };
        let history = [];

        function saveState() {
            history.push({
                main: ctx.getImageData(0, 0, canvas.width, canvas.height),
                audio: audioCtx2D.getImageData(0, 0, audioCanvas.width, audioCanvas.height)
            });
            if (history.length > 25) history.shift();
        }

        const toolAudioMap = {
            lapiz:   { type: 'sine',     audioRed: 10 },
            crayon:  { type: 'triangle', audioRed: 20 },
            fibra:   { type: 'sawtooth', audioRed: 30 },
            pincel:  { type: 'sine',     audioRed: 40 },
            aerosol: { type: 'square',   audioRed: 50 },
            kick:    { type: 'kick909',  audioRed: 60 },
            hihat:   { type: 'hihat909', audioRed: 70 },
            snare:   { type: 'snare909', audioRed: 80 }
        };

        const scales = {
            mayor: [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25],
            menor: [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23, 392.00, 466.16, 523.25]
        };

        function drawBackgroundAndGrid() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (showGrid) {
                ctx.save();
                ctx.strokeStyle = '#e0e0e8';
                ctx.lineWidth = 1;

                // 16 pasos verticales (grilla rítmica)
                const steps = 16;
                for (let i = 1; i < steps; i++) {
                    const x = (canvas.width / steps) * i;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }

                // Líneas horizontales de referencia de notas
                const notesCount = 11;
                for (let i = 1; i < notesCount; i++) {
                    const y = (canvas.height / notesCount) * i;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        drawBackgroundAndGrid();
        audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        saveState();

        document.getElementById('gridBtn').addEventListener('click', (e) => {
            showGrid = !showGrid;
            e.target.classList.toggle('active', showGrid);
            e.target.textContent = showGrid ? 'Grilla: ON' : 'Grilla: OFF';
            
            // Redibujamos el estado actual manteniendo el contenido dibujado por el usuario
            redrawCanvasFromHistory();
        });

        function redrawCanvasFromHistory() {
            if (history.length > 0) {
                const currentState = history[history.length - 1];
                
                // Fondo blanco + grilla opcional
                drawBackgroundAndGrid();
                
                // Creamos un canvas temporal para superponer los trazos del usuario encima de la grilla nueva
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.putImageData(currentState.main, 0, 0);
                
                ctx.drawImage(tempCanvas, 0, 0);
            }
        }

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const targetBtn = e.target.closest('button');
                targetBtn.classList.add('active');
                currentTool = targetBtn.dataset.tool;
            });
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        let lastX = 0, lastY = 0;

        function startDown(e) {
            e.preventDefault();
            isDrawing = true;
            saveState();
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
            
            if (currentTool === 'kick' || currentTool === 'hihat' || currentTool === 'snare') {
                drawShape(pos.x, pos.y);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            
            if (currentTool === 'kick' || currentTool === 'hihat' || currentTool === 'snare') return;

            const color = document.getElementById('colorPicker').value;
            const size = parseInt(document.getElementById('sizeRange').value);

            if (currentTool === 'goma') {
                ctx.save(); audioCtx2D.save();
                ctx.beginPath(); audioCtx2D.beginPath();
                ctx.arc(pos.x, pos.y, size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill();
                audioCtx2D.clearRect(pos.x - size*1.5, pos.y - size*1.5, size*3, size*3);
                ctx.restore(); audioCtx2D.restore();
                lastX = pos.x; lastY = pos.y;
                return;
            }

            const toolInfo = toolAudioMap[currentTool];
            const audioColorStr = `rgb(${toolInfo.audioRed}, ${size}, 0)`;

            ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = color; ctx.fillStyle = color;
            
            audioCtx2D.globalAlpha = 1.0;
            audioCtx2D.lineWidth = size; audioCtx2D.lineCap = 'round'; audioCtx2D.lineJoin = 'round';
            audioCtx2D.strokeStyle = audioColorStr; audioCtx2D.fillStyle = audioColorStr;

            if (currentTool === 'aerosol') {
                for (let i = 0; i < 10; i++) {
                    const offsetX = (Math.random() - 0.5) * size * 2.5;
                    const offsetY = (Math.random() - 0.5) * size * 2.5;
                    ctx.globalAlpha = 0.3; ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                    audioCtx2D.globalAlpha = 0.6; audioCtx2D.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                }
                ctx.globalAlpha = 1.0; audioCtx2D.globalAlpha = 1.0;
            } else if (currentTool === 'crayon') {
                ctx.globalAlpha = 0.5;
                drawLine(ctx, lastX, lastY, pos.x, pos.y); 
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
                ctx.globalAlpha = 1.0;
            } else if (currentTool === 'pincel') {
                ctx.globalAlpha = 0.3; ctx.lineWidth = size * 1.8;
                drawLine(ctx, lastX, lastY, pos.x, pos.y); 
                audioCtx2D.lineWidth = size * 1.8;
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
                ctx.globalAlpha = 1.0; 
            } else if (currentTool === 'fibra') {
                ctx.lineWidth = size * 1.2; audioCtx2D.lineWidth = size * 1.2;
                drawLine(ctx, lastX, lastY, pos.x, pos.y); drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            } else {
                drawLine(ctx, lastX, lastY, pos.x, pos.y); drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            }

            lastX = pos.x; lastY = pos.y;
        }

        function drawShape(x, y) {
            const rawSize = parseInt(document.getElementById('sizeRange').value);
            const size = Math.max(rawSize * 1.5, 12);
            const toolInfo = toolAudioMap[currentTool];
            const audioColorStr = `rgb(${toolInfo.audioRed}, ${rawSize}, 0)`;

            ctx.save(); audioCtx2D.save();
            
            if (currentTool === 'kick') {
                ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
            } else if (currentTool === 'hihat') {
                ctx.fillStyle = '#2ed573'; ctx.beginPath();
                ctx.moveTo(x, y - size); ctx.lineTo(x - size, y + size); ctx.lineTo(x + size, y + size); ctx.closePath(); ctx.fill();
            } else if (currentTool === 'snare') {
                ctx.fillStyle = '#1e90ff'; ctx.fillRect(x - size, y - size, size * 2, size * 2);
            }

            audioCtx2D.fillStyle = audioColorStr;
            audioCtx2D.fillRect(x - 1, y - 1, 2, 2);
            
            ctx.restore(); audioCtx2D.restore();
        }

        function drawLine(context, x1, y1, x2, y2) {
            context.beginPath(); context.moveTo(x1, y1); context.lineTo(x2, y2); context.stroke();
        }

        function stopDraw() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDown);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('touchstart', startDown, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (history.length > 1) {
                history.pop();
                redrawCanvasFromHistory();
                
                // Actualizamos también el canvas de audio con el estado anterior
                const prevState = history[history.length - 1];
                audioCtx2D.putImageData(prevState.audio, 0, 0);
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            saveState();
            drawBackgroundAndGrid();
            audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        });

        function stopAllActiveTones() {
            for (const tool in continuousTones) {
                for (const tone of continuousTones[tool]) {
                    stopContinuousTone(tone);
                }
            }
            continuousTones = {};
            oneShotTones = {};
            drumCooldown = { kick: 0, hihat: 0, snare: 0 };
        }

        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                masterCompressor = audioCtx.createDynamicsCompressor();
                masterCompressor.threshold.setValueAtTime(-24, audioCtx.currentTime); 
                masterCompressor.knee.setValueAtTime(30, audioCtx.currentTime);
                masterCompressor.ratio.setValueAtTime(12, audioCtx.currentTime); 
                masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime); 
                masterCompressor.release.setValueAtTime(0.25, audioCtx.currentTime);

                masterGain = audioCtx.createGain();
                masterGain.gain.value = 2.5; 

                masterGain.connect(masterCompressor);
                masterCompressor.connect(audioCtx.destination);
            }

            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isPlaying = !isPlaying;
            playBtn.classList.toggle('active', isPlaying);
            playBtn.textContent = isPlaying ? '⏸ Pausa' : '▶ Play';
            scanLine.style.display = isPlaying ? 'block' : 'none';

            if (!isPlaying) {
                stopAllActiveTones();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            for (const k in drumCooldown) {
                if (drumCooldown[k] > 0) drumCooldown[k]--;
            }

            const speed = parseFloat(document.getElementById('tempoSelect').value);
            scanX += speed;
            if (scanX > canvas.width) scanX = 0;

            const percent = (scanX / canvas.width) * 100;
            scanLine.style.left = percent + '%';

            checkColumnAndPlay(scanX);
        }

        function checkColumnAndPlay(x) {
            const colIndex = Math.floor(x);
            if (colIndex >= audioCanvas.width) return;

            const imgData = audioCtx2D.getImageData(colIndex, 0, 1, audioCanvas.height);
            const data = imgData.data;
            
            const scaleType = document.getElementById('scaleSelect').value;
            const currentScale = scales[scaleType];
            
            const continuousTargets = { lapiz: new Map(), crayon: new Map(), fibra: new Map(), pincel: new Map() };
            const currentOneShots = new Map(); 
            
            let drumsInColumn = { kick: 0, hihat: 0, snare: 0 };

            for (let y = 0; y < audioCanvas.height; y += 8) {
                const r = data[(y * 4)];
                const g = data[(y * 4) + 1]; 
                const alpha = data[(y * 4) + 3];

                if (alpha > 15) {
                    const rSnap = Math.round(r / 10) * 10; 

                    if (rSnap >= 10 && rSnap <= 80) {
                        let tool = 'lapiz';
                        if (rSnap === 20) tool = 'crayon';
                        else if (rSnap === 30) tool = 'fibra';
                        else if (rSnap === 40) tool = 'pincel';
                        else if (rSnap === 50) tool = 'aerosol';
                        else if (rSnap === 60) tool = 'kick';
                        else if (rSnap === 70) tool = 'hihat';
                        else if (rSnap === 80) tool = 'snare';

                        const noteIndex = Math.floor(((audioCanvas.height - y) / audioCanvas.height) * currentScale.length);
                        const drawnSize = g > 0 ? g : 4; 
                        const intensity = Math.min(drawnSize / 8, 1.8);

                        if (['lapiz', 'crayon', 'fibra', 'pincel'].includes(tool)) {
                            if (!continuousTargets[tool].has(noteIndex)) {
                                continuousTargets[tool].set(noteIndex, intensity);
                            } else {
                                continuousTargets[tool].set(noteIndex, Math.max(continuousTargets[tool].get(noteIndex), intensity));
                            }
                        } else if (tool === 'aerosol') {
                            const key = `${tool}_${noteIndex}`;
                            if (!currentOneShots.has(key)) currentOneShots.set(key, intensity);
                        } else if (['kick', 'hihat', 'snare'].includes(tool)) {
                            drumsInColumn[tool] = Math.max(drumsInColumn[tool], intensity);
                        }
                    }
                }
            }

            const now = audioCtx.currentTime;

            for (const tool in continuousTargets) {
                let targets = Array.from(continuousTargets[tool].entries()).map(([noteIdx, intensity]) => {
                    return { freq: currentScale[Math.min(noteIdx, currentScale.length - 1)], intensity };
                });
                targets.sort((a, b) => a.freq - b.freq);

                if (!continuousTones[tool]) continuousTones[tool] = [];
                let active = continuousTones[tool];
                active.sort((a, b) => a.freq - b.freq);

                let nextActive = [];
                let maxLen = Math.max(targets.length, active.length);

                for (let i = 0; i < maxLen; i++) {
                    if (i < targets.length && i < active.length) {
                        let oscObj = active[i];
                        let target = targets[i];
                        
                        oscObj.missingFrames = 0; 
                        oscObj.osc.frequency.setTargetAtTime(target.freq, now, 0.05);
                        
                        const vol = 0.2 * target.intensity;
                        oscObj.gainNode.gain.setTargetAtTime(vol, now, 0.03);
                        oscObj.freq = target.freq;
                        nextActive.push(oscObj);
                    } else if (i < targets.length) {
                        let target = targets[i];
                        let oscObj = startContinuousTone(target.freq, target.intensity, tool);
                        oscObj.freq = target.freq;
                        oscObj.missingFrames = 0;
                        nextActive.push(oscObj);
                    } else if (i < active.length) {
                        let oscObj = active[i];
                        oscObj.missingFrames = (oscObj.missingFrames || 0) + 1;
                        if (oscObj.missingFrames > 12) { 
                            stopContinuousTone(oscObj);
                        } else {
                            nextActive.push(oscObj); 
                        }
                    }
                }
                continuousTones[tool] = nextActive;
            }

            for (const drum of ['kick', 'hihat', 'snare']) {
                if (drumsInColumn[drum] > 0) {
                    if (drumCooldown[drum] === 0) {
                        playPercussion(drum, drumsInColumn[drum]);
                        drumCooldown[drum] = 30; 
                    }
                }
            }

            for (const [key, intensity] of currentOneShots.entries()) {
                if (!oneShotTones[key]) {
                    const [toolStr, noteIdxStr] = key.split('_');
                    const noteIndex = parseInt(noteIdxStr);
                    const freq = currentScale[Math.min(noteIndex, currentScale.length - 1)];
                    playShortTone(freq, intensity, toolStr);
                    oneShotTones[key] = true; 
                }
            }
            for (const key in oneShotTones) {
                if (!currentOneShots.has(key)) delete oneShotTones[key]; 
            }
        }

        function startContinuousTone(freq, intensity, tool) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = toolAudioMap[tool].type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            const baseGain = 0.2 * intensity; 
            gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(baseGain, audioCtx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(masterGain); 
            osc.start();
            return { osc, gainNode, freq, missingFrames: 0 };
        }

        function stopContinuousTone(toneObj) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            try {
                toneObj.gainNode.gain.cancelScheduledValues(now);
                toneObj.gainNode.gain.setValueAtTime(Math.max(toneObj.gainNode.gain.value, 0.0001), now);
                toneObj.gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
                toneObj.osc.stop(now + 0.15);
            } catch (e) {}
        }

        function playShortTone(freq, intensity, tool) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = toolAudioMap[tool].type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            const baseGain = 0.15 * intensity;
            gainNode.gain.setValueAtTime(baseGain, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            osc.connect(gainNode); gainNode.connect(masterGain);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playPercussion(type, intensity = 1.0) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const volMultiplier = Math.min(intensity, 1.5);

                if (type === 'kick') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(130, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.06); 
                    
                    gain.gain.setValueAtTime(1.8 * volMultiplier, now); 
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    
                    osc.connect(gain); gain.connect(masterGain);
                    osc.start(now); osc.stop(now + 0.3);

                } else if (type === 'hihat') {
                    const bufferSize = audioCtx.sampleRate * 0.04;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'highpass'; filter.frequency.value = 7000;
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.7 * volMultiplier, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
                    noise.start(now);

                } else if (type === 'snare') {
                    const osc = audioCtx.createOscillator();
                    const oscGain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    oscGain.gain.setValueAtTime(0.6 * volMultiplier, now);
                    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(oscGain); oscGain.connect(masterGain);
                    osc.start(now); osc.stop(now + 0.18);

                    const bufferSize = audioCtx.sampleRate * 0.15;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass'; filter.frequency.value = 2000;
                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.7 * volMultiplier, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
                    noise.start(now);
                }
            } catch (e) {}
        }

        animate();
    </script>
</body>
