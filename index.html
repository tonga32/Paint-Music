<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paint Musical - TR-909 PRO Definitive</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #121218;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
        }
        h1 { margin: 5px 0; font-size: 1.3rem; text-align: center; }
        p { margin: 0 0 8px 0; color: #a0a0c0; font-size: 0.8rem; text-align: center; }
        
        #controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            background: #1e1e2f;
            padding: 8px;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        button, select, input {
            padding: 5px 7px;
            border: none;
            border-radius: 5px;
            background: #4e4efc;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
        }
        button:hover, select:hover { background: #3b3bfc; }
        button.active { background: #ff7675; }
        
        input[type="color"] {
            border: none;
            width: 30px;
            height: 26px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        input[type="range"] {
            width: 65px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #3a3a5c;
            background: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #gridCanvas {
            pointer-events: none;
            display: none;
        }

        #scanLine {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Paint Musical & TR-909 PRO</h1>
    <p>¡Dibujá y percute fluidamente en pentatónicas!</p>

    <div id="controls">
        <div class="control-group">
            <button class="tool-btn active" data-tool="lapiz" title="Lápiz">✏️</button>
            <button class="tool-btn" data-tool="crayon" title="Crayón">🖍️</button>
            <button class="tool-btn" data-tool="fibra" title="Fibra">✒️</button>
            <button class="tool-btn" data-tool="pincel" title="Pincel">🖌️</button>
            <button class="tool-btn" data-tool="aerosol" title="Spray">💨</button>
        </div>

        <div class="control-group">
            <button class="tool-btn" data-tool="kick" title="Kick">⭕</button>
            <button class="tool-btn" data-tool="hihat" title="Hi-Hat">🔺</button>
            <button class="tool-btn" data-tool="snare" title="Snare">⬜</button>
            <button class="tool-btn" data-tool="clap" title="Clap">👏</button>
            <button class="tool-btn" data-tool="goma" title="Borrar">❌</button>
        </div>

        <div class="control-group">
            <input type="color" id="colorPicker" value="#000000" title="Color">
        </div>

        <div class="control-group">
            <label>Grosor:</label>
            <input type="range" id="sizeRange" min="1" max="25" value="4">
        </div>

        <div class="control-group">
            <label>Escala:</label>
            <select id="scaleSelect">
                <option value="pentatonic_menor" selected>Penta Menor</option>
                <option value="pentatonic_mayor">Penta Mayor</option>
            </select>
        </div>

        <div class="control-group">
            <label>Tempo:</label>
            <select id="tempoSelect">
                <option value="1">Lento</option>
                <option value="2" selected>Normal</option>
                <option value="3.5">Rápido</option>
            </select>
        </div>

        <div class="control-group">
            <button id="gridBtn">Grilla: OFF</button>
            <button id="playBtn" style="background: #00b894;">▶ Play</button>
            <button id="undoBtn" style="background: #e17055;">↶</button>
            <button id="clearBtn" style="background: #d63031;">🗑</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="500" height="500"></canvas>
        <canvas id="gridCanvas" width="500" height="500"></canvas>
        <canvas id="audioCanvas" width="500" height="500" style="display:none;"></canvas>
        <div id="scanLine"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audioCanvas = document.getElementById('audioCanvas');
        const audioCtx2D = audioCanvas.getContext('2d');
        const gridCanvas = document.getElementById('gridCanvas');
        const gridCtx = gridCanvas.getContext('2d');
        const scanLine = document.getElementById('scanLine');

        const STEPS = 16; 
        const ROWS = 11;

        let isDrawing = false;
        let currentTool = 'lapiz';
        let isPlaying = false;
        let showGrid = false;
        let scanX = 0;
        let lastStep = -1;
        let lastColIndex = -1;
        
        let audioCtx = null;
        let masterGain = null;
        let masterCompressor = null;
        
        let continuousTones = {}; 
        let oneShotTones = {};
        let drumSequence = Array(STEPS).fill(null).map(() => ([]));
        let history = [];

        // Grilla visual
        gridCtx.strokeStyle = 'rgba(200, 200, 220, 0.7)';
        gridCtx.lineWidth = 1;
        gridCtx.setLineDash([4, 4]);
        for (let i = 1; i < STEPS; i++) {
            const x = (gridCanvas.width / STEPS) * i;
            gridCtx.beginPath(); gridCtx.moveTo(x, 0); gridCtx.lineTo(x, gridCanvas.height); gridCtx.stroke();
        }
        for (let i = 1; i < ROWS; i++) {
            const y = (gridCanvas.height / ROWS) * i;
            gridCtx.beginPath(); gridCtx.moveTo(0, y); gridCtx.lineTo(gridCanvas.width, y); gridCtx.stroke();
        }

        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            masterCompressor = audioCtx.createDynamicsCompressor();
            masterCompressor.threshold.value = -3;
            masterCompressor.knee.value = 10;
            masterCompressor.ratio.value = 4;
            masterCompressor.attack.value = 0.01;
            masterCompressor.release.value = 0.1;

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0; 

            masterGain.connect(masterCompressor);
            masterCompressor.connect(audioCtx.destination);
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        window.addEventListener('mousedown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        function saveState() {
            history.push({
                main: ctx.getImageData(0, 0, canvas.width, canvas.height),
                audio: audioCtx2D.getImageData(0, 0, audioCanvas.width, audioCanvas.height),
                drums: JSON.parse(JSON.stringify(drumSequence))
            });
            if (history.length > 25) history.shift();
        }

        const toolAudioMap = {
            lapiz:   { type: 'sine',     audioRed: 10 },
            crayon:  { type: 'triangle', audioRed: 20 },
            fibra:   { type: 'sawtooth', audioRed: 30 },
            pincel:  { type: 'sine',     audioRed: 40 },
            aerosol: { type: 'square',   audioRed: 50 }
        };

        // Escalas Pentatónicas (11 notas desde C3)
        const scales = {
            pentatonic_mayor: [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25],
            pentatonic_menor: [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23, 392.00, 466.16, 523.25]
        };

        function quantizePos(x, y) {
            const cellW = canvas.width / STEPS;
            const cellH = canvas.height / ROWS;
            const col = Math.min(STEPS - 1, Math.max(0, Math.floor(x / cellW)));
            const row = Math.min(ROWS - 1, Math.max(0, Math.floor(y / cellH)));
            return { col, row, x: (col * cellW) + (cellW / 2), y: (row * cellH) + (cellH / 2), rectX: col * cellW, rectY: row * cellH, cellW, cellH };
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        saveState();

        document.getElementById('gridBtn').addEventListener('click', (e) => {
            showGrid = !showGrid;
            e.target.classList.toggle('active', showGrid);
            e.target.textContent = showGrid ? 'Grilla: ON' : 'Grilla: OFF';
            gridCanvas.style.display = showGrid ? 'block' : 'none';
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const targetBtn = e.target.closest('button');
                targetBtn.classList.add('active');
                currentTool = targetBtn.dataset.tool;
            });
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        let lastX = 0, lastY = 0;

        function startDown(e) {
            e.preventDefault();
            initAudio(); 

            const pos = getPos(e);
            const isPercussion = ['kick', 'hihat', 'snare', 'clap'].includes(currentTool);
            
            saveState();
            isDrawing = true;
            lastX = pos.x; 
            lastY = pos.y;
            
            if (isPercussion) {
                const q = quantizePos(pos.x, pos.y);
                if (!drumSequence[q.col].some(d => d.row === q.row && d.tool === currentTool)) {
                    drumSequence[q.col].push({ tool: currentTool, row: q.row });
                    drawShape(q.x, q.y, currentTool);
                    playPercussion(currentTool, 1.0);
                }
            } else if (currentTool === 'goma') {
                draw(e);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            if (['kick', 'hihat', 'snare', 'clap'].includes(currentTool)) return;

            const color = document.getElementById('colorPicker').value;
            const size = parseInt(document.getElementById('sizeRange').value);

            if (currentTool === 'goma') {
                ctx.save();
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; 
                ctx.fill(); 
                ctx.restore();

                audioCtx2D.save();
                audioCtx2D.beginPath();
                audioCtx2D.arc(pos.x, pos.y, size * 1.5, 0, Math.PI * 2);
                audioCtx2D.globalCompositeOperation = 'destination-out';
                audioCtx2D.fillStyle = 'rgba(0,0,0,1)';
                audioCtx2D.fill();
                audioCtx2D.globalCompositeOperation = 'source-over';
                audioCtx2D.restore();
                
                const q = quantizePos(pos.x, pos.y);
                let deletedDrum = false;
                
                drumSequence[q.col] = drumSequence[q.col].filter(d => {
                    if (d.row === q.row) { deletedDrum = true; return false; }
                    return true;
                });
                
                if (deletedDrum) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(q.rectX, q.rectY, q.cellW, q.cellH); 
                }

                lastX = pos.x; lastY = pos.y;
                return;
            }

            const toolInfo = toolAudioMap[currentTool];
            const audioColorStr = `rgb(${toolInfo.audioRed}, ${size}, 0)`;

            ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = color; ctx.fillStyle = color;
            
            audioCtx2D.globalCompositeOperation = 'source-over';
            audioCtx2D.globalAlpha = 1.0;
            audioCtx2D.lineWidth = size; audioCtx2D.lineCap = 'round'; audioCtx2D.lineJoin = 'round';
            audioCtx2D.strokeStyle = audioColorStr; audioCtx2D.fillStyle = audioColorStr;

            if (currentTool === 'aerosol') {
                for (let i = 0; i < 10; i++) {
                    const offsetX = (Math.random() - 0.5) * size * 2.5;
                    const offsetY = (Math.random() - 0.5) * size * 2.5;
                    ctx.globalAlpha = 0.3; ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                    audioCtx2D.globalAlpha = 0.6; audioCtx2D.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                }
                ctx.globalAlpha = 1.0; audioCtx2D.globalAlpha = 1.0;
            } else if (currentTool === 'crayon') {
                ctx.globalAlpha = 0.5;
                drawLine(ctx, lastX, lastY, pos.x, pos.y); 
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
                ctx.globalAlpha = 1.0;
            } else if (currentTool === 'pincel') {
                ctx.globalAlpha = 0.3; ctx.lineWidth = size * 1.8;
                drawLine(ctx, lastX, lastY, pos.x, pos.y); 
                audioCtx2D.lineWidth = size * 1.8;
                drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
                ctx.globalAlpha = 1.0; 
            } else if (currentTool === 'fibra') {
                ctx.lineWidth = size * 1.2; audioCtx2D.lineWidth = size * 1.2;
                drawLine(ctx, lastX, lastY, pos.x, pos.y); drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            } else {
                drawLine(ctx, lastX, lastY, pos.x, pos.y); drawLine(audioCtx2D, lastX, lastY, pos.x, pos.y);
            }

            lastX = pos.x; lastY = pos.y;
        }

        function drawShape(x, y, tool) {
            const rawSize = parseInt(document.getElementById('sizeRange').value);
            const size = Math.max(rawSize * 1.5, 14); 
            
            ctx.save();
            if (tool === 'kick') {
                ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
            } else if (tool === 'hihat') {
                ctx.fillStyle = '#2ed573'; ctx.beginPath();
                ctx.moveTo(x, y - size); ctx.lineTo(x - size, y + size); ctx.lineTo(x + size, y + size); ctx.closePath(); ctx.fill();
            } else if (tool === 'snare') {
                ctx.fillStyle = '#1e90ff'; ctx.fillRect(x - size, y - size, size * 2, size * 2);
            } else if (tool === 'clap') {
                ctx.fillStyle = '#ffa502'; ctx.beginPath();
                ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawLine(context, x1, y1, x2, y2) {
            context.beginPath(); context.moveTo(x1, y1); context.lineTo(x2, y2); context.stroke();
        }

        function stopDraw() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDown);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('touchstart', startDown, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (history.length > 0) {
                const prevState = history.pop();
                ctx.putImageData(prevState.main, 0, 0);
                audioCtx2D.putImageData(prevState.audio, 0, 0);
                drumSequence = JSON.parse(JSON.stringify(prevState.drums));
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            saveState(); 
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            audioCtx2D.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
            drumSequence = Array(STEPS).fill(null).map(() => ([])); 
        });

        function stopAllActiveTones() {
            for (const tool in continuousTones) {
                for (const tone of continuousTones[tool]) {
                    if (audioCtx) {
                        tone.gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                        tone.gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                        tone.osc.stop(audioCtx.currentTime + 0.15);
                    }
                }
            }
            continuousTones = {};
            oneShotTones = {};
        }

        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', () => {
            initAudio(); 
            
            isPlaying = !isPlaying;
            playBtn.classList.toggle('active', isPlaying);
            playBtn.textContent = isPlaying ? '⏸ Pausa' : '▶ Play';
            scanLine.style.display = isPlaying ? 'block' : 'none';

            if (!isPlaying) {
                stopAllActiveTones();
                lastColIndex = -1;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const speed = parseFloat(document.getElementById('tempoSelect').value);
            scanX += speed;
            if (scanX > canvas.width) {
                scanX = 0;
                lastStep = -1; 
                lastColIndex = -1;
            }

            const percent = (scanX / canvas.width) * 100;
            scanLine.style.left = percent + '%';

            // Optimización clave: Lee el canvas de audio solo cuando cambia de columna exacta para evitar lag
            const colIndex = Math.floor(scanX);
            if (colIndex !== lastColIndex && colIndex < audioCanvas.width) {
                lastColIndex = colIndex;
                checkColumnAndPlay(colIndex);
            }

            const currentStep = Math.floor(scanX / (canvas.width / STEPS));
            if (currentStep !== lastStep && currentStep >= 0 && currentStep < STEPS) {
                lastStep = currentStep;
                drumSequence[currentStep].forEach(drum => {
                    playPercussion(drum.tool, 1.0);
                });
            }
        }

        function checkColumnAndPlay(colIndex) {
            const imgData = audioCtx2D.getImageData(colIndex, 0, 1, audioCanvas.height);
            const data = imgData.data;
            const scaleType = document.getElementById('scaleSelect').value || 'pentatonic_menor';
            const currentScale = scales[scaleType];
            const continuousTargets = { lapiz: new Map(), crayon: new Map(), fibra: new Map(), pincel: new Map() };
            const currentOneShots = new Map(); 

            for (let y = 0; y < audioCanvas.height; y += 8) {
                const r = data[(y * 4)];
                const g = data[(y * 4) + 1]; 
                const alpha = data[(y * 4) + 3];

                if (alpha > 15) {
                    const rSnap = Math.round(r / 10) * 10; 
                    if (rSnap >= 10 && rSnap <= 50) {
                        let tool = 'lapiz';
                        if (rSnap === 20) tool = 'crayon';
                        else if (rSnap === 30) tool = 'fibra';
                        else if (rSnap === 40) tool = 'pincel';
                        else if (rSnap === 50) tool = 'aerosol';

                        const noteIndex = Math.floor(((audioCanvas.height - y) / audioCanvas.height) * currentScale.length);
                        const safeIndex = Math.min(noteIndex, currentScale.length - 1);
                        const drawnSize = g > 0 ? g : 4; 
                        const intensity = Math.min(drawnSize / 8, 1.8);

                        if (['lapiz', 'crayon', 'fibra', 'pincel'].includes(tool)) {
                            if (!continuousTargets[tool].has(safeIndex)) {
                                continuousTargets[tool].set(safeIndex, intensity);
                            } else {
                                continuousTargets[tool].set(safeIndex, Math.max(continuousTargets[tool].get(safeIndex), intensity));
                            }
                        } else if (tool === 'aerosol') {
                            const key = `${tool}_${safeIndex}`;
                            if (!currentOneShots.has(key)) currentOneShots.set(key, intensity);
                        }
                    }
                }
            }

            const now = audioCtx.currentTime;

            for (const tool in continuousTargets) {
                let targets = Array.from(continuousTargets[tool].entries()).map(([noteIdx, intensity]) => {
                    return { freq: currentScale[noteIdx], intensity };
                });
                targets.sort((a, b) => a.freq - b.freq);

                if (!continuousTones[tool]) continuousTones[tool] = [];
                let active = continuousTones[tool];
                active.sort((a, b) => a.freq - b.freq);

                let nextActive = [];
                let maxLen = Math.max(targets.length, active.length);

                for (let i = 0; i < maxLen; i++) {
                    if (i < targets.length && i < active.length) {
                        let oscObj = active[i];
                        let target = targets[i];
                        oscObj.missingFrames = 0; 
                        oscObj.osc.frequency.setTargetAtTime(target.freq, now, 0.05);
                        oscObj.gainNode.gain.setTargetAtTime(0.2 * target.intensity, now, 0.03);
                        oscObj.freq = target.freq;
                        nextActive.push(oscObj);
                    } else if (i < targets.length) {
                        let target = targets[i];
                        let oscObj = startContinuousTone(target.freq, target.intensity, tool);
                        oscObj.freq = target.freq;
                        oscObj.missingFrames = 0;
                        nextActive.push(oscObj);
                    } else if (i < active.length) {
                        let oscObj = active[i];
                        oscObj.missingFrames = (oscObj.missingFrames || 0) + 1;
                        if (oscObj.missingFrames > 12) { 
                            stopContinuousTone(oscObj);
                        } else {
                            nextActive.push(oscObj); 
                        }
                    }
                }
                continuousTones[tool] = nextActive;
            }

            for (const [key, intensity] of currentOneShots.entries()) {
                if (!oneShotTones[key]) {
                    const [toolStr, noteIdxStr] = key.split('_');
                    const noteIndex = parseInt(noteIdxStr);
                    playShortTone(currentScale[noteIndex], intensity, toolStr);
                    oneShotTones[key] = true; 
                }
            }
            for (const key in oneShotTones) {
                if (!currentOneShots.has(key)) delete oneShotTones[key]; 
            }
        }

        function startContinuousTone(freq, intensity, tool) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = toolAudioMap[tool].type;
            osc.frequency.value = freq;
            gainNode.gain.value = 0.0001;
            gainNode.gain.exponentialRampToValueAtTime(0.2 * intensity, audioCtx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(masterGain); 
            osc.start();
            return { osc, gainNode, freq, missingFrames: 0 };
        }

        function stopContinuousTone(toneObj) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            toneObj.gainNode.gain.cancelScheduledValues(now);
            toneObj.gainNode.gain.setValueAtTime(Math.max(toneObj.gainNode.gain.value, 0.0001), now);
            toneObj.gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
            toneObj.osc.stop(now + 0.15);
        }

        function playShortTone(freq, intensity, tool) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = toolAudioMap[tool].type;
            osc.frequency.value = freq;
            gainNode.gain.value = 0.15 * intensity;
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
            osc.connect(gainNode); gainNode.connect(masterGain);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function playPercussion(type, intensity = 1.0) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const volMultiplier = Math.min(intensity, 1.5);

            if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.exponentialRampToValueAtTime(45, now + 0.06); 
                gain.gain.setValueAtTime(1.8 * volMultiplier, now); 
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(now); osc.stop(now + 0.3);

            } else if (type === 'hihat') {
                const bufferSize = audioCtx.sampleRate * 0.04;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 7000;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.7 * volMultiplier, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
                noise.start(now); noise.stop(now + 0.1);

            } else if (type === 'snare') {
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                oscGain.gain.setValueAtTime(0.6 * volMultiplier, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08); 
                osc.connect(oscGain); oscGain.connect(masterGain);
                osc.start(now); osc.stop(now + 0.1);

                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass'; filter.frequency.value = 2500;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.7 * volMultiplier, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); 
                noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
                noise.start(now); noise.stop(now + 0.15);

            } else if (type === 'clap') {
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass'; filter.frequency.value = 1500;
                
                const gain = audioCtx.createGain();
                
                gain.gain.setValueAtTime(0.8 * volMultiplier, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                gain.gain.setValueAtTime(0.9 * volMultiplier, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                gain.gain.setValueAtTime(1.0 * volMultiplier, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
                noise.start(now); noise.stop(now + 0.25);
            }
        }

        animate();
    </script>
